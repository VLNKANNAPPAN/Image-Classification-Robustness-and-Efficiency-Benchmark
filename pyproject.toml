[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-robustness-benchmark"
version = "0.1.0"
description = "A reproducible image classification robustness and efficiency study"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "PyYAML",
  "Pillow",
  "pandas",
  "matplotlib",
  "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

