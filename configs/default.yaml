seed: 42
output_dir: /kaggle/working/image-robustness-results

data:
  dataset_root: /kaggle/input/intel-image-classification
  train_dir: null
  test_dir: null
  image_size: 224
  batch_size: 64
  num_workers: 2
  validation_fraction: 0.15
  pin_memory: true

model:
  num_classes: 6
  baseline_channels: [32, 64, 128]
  dropout: 0.3
  mobilenet:
    pretrained: true
    freeze_features: true

training:
  epochs: 12
  learning_rate: 0.001
  weight_decay: 0.0001
  max_train_batches: null
  max_validation_batches: null

degradations:
  gaussian_blur_sigmas: [1.0, 2.0, 4.0]
  brightness_factors: [0.6, 1.4]
  jpeg_qualities: [90, 50, 20]

evaluation:
  error_examples: 12
  error_conditions: [clean, gaussian_blur_sigma_4, brightness_factor_0.6, brightness_factor_1.4, jpeg_quality_20]

benchmark:
  batch_size: 1
  warmup_iterations: 10
  timed_iterations: 50

